[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-payer-files"
version = "2.0.0"
description = "Seeded synthetic payer delivery files (CMS CCLF + a fictional MA payer) with answer keys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
generate-cclf = "synthetic_payer_files.generate_cclf:main"
generate-ma-payer = "synthetic_payer_files.generate_ma_payer:main"
validate-cclf = "synthetic_payer_files.validate_cclf:main"
validate-ma-payer = "synthetic_payer_files.validate_ma_payer:main"
validate-crosspayer = "synthetic_payer_files.validate_crosspayer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
