# Lint, tests, and a determinism check on every push to main and every PR: regenerating
# seed 42 must reproduce the committed output/ and answer_key/ byte for byte, and all
# three validators must pass on it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Regenerate seed 42
        run: |
          generate-cclf --seed 42 --start 2023-01 --end 2025-12
          generate-ma-payer --seed 42 --start 2023-01 --end 2025-12

      - name: Validate
        run: |
          validate-cclf
          validate-ma-payer
          validate-crosspayer

      - name: Committed files match regenerated output
        run: |
          git diff --exit-code --stat -- output answer_key
          test -z "$(git status --porcelain -- output answer_key)"
